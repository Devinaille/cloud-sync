name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: test / vet / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: cloud-sync/go.sum

      - name: gofmt
        working-directory: cloud-sync
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "gofmt drift:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        working-directory: cloud-sync
        run: go vet ./...

      - name: go test
        working-directory: cloud-sync
        run: go test -race -count=1 ./...

      - name: go build
        working-directory: cloud-sync
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o cloud-sync .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sync-linux-amd64
          path: cloud-sync/cloud-sync
          if-no-files-found: error

  docker:
    name: docker image build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: cloud-sync
          file: cloud-sync/Dockerfile
          tags: cloud-sync:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size (< 30 MiB)
        run: |
          SIZE=$(docker image inspect cloud-sync:ci --format '{{.Size}}')
          echo "image size: $SIZE bytes"
          LIMIT=31457280   # 30 * 1024 * 1024
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::image size $SIZE bytes exceeds limit $LIMIT bytes (30 MiB)"
            exit 1
          fi
