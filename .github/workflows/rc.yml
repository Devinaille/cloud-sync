# Release candidate packaging.
#
# Triggers on tags containing "-rc" (e.g. v1.0.0-rc1), or manual dispatch.
# Produces:
#   - a GitHub pre-release with cloud-sync_<tag>_linux_amd64.tar.gz + SHA256SUMS
#   - ghcr.io/devinaille/cloud-sync:<tag>
#
# For a full (non-pre) release, see release.yml.

name: RC

on:
  push:
    tags:
      - 'v*-rc*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build as a pre-release (e.g. v1.0.0-rc1)'
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/devinaille/cloud-sync

jobs:
  package:
    name: build + pre-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: ver
        run: |
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${{ steps.ver.outputs.tag }} is not on main; cut rc/release from main after merging dev"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: cloud-sync/go.sum

      - name: gofmt / vet / test
        working-directory: cloud-sync
        run: |
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt
          go vet ./...
          go test -race -count=1 ./...

      - name: Build (linux/amd64)
        working-directory: cloud-sync
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X cloud-sync/internal/buildinfo.Version=${{ steps.ver.outputs.tag }} -X cloud-sync/internal/buildinfo.Commit=${{ steps.ver.outputs.commit }} -X cloud-sync/internal/buildinfo.BuildTime=${{ steps.ver.outputs.iso }}" \
            -o cloud-sync .

      - name: Package tarball + checksums
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          STAGE="cloud-sync_${TAG}_linux_amd64"
          mkdir -p "dist/$STAGE"
          cp cloud-sync/cloud-sync "dist/$STAGE/cloud-sync"
          cp cloud-sync/README.md "dist/$STAGE/README.md"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"
          ( cd dist && sha256sum -- *.tar.gz > SHA256SUMS )
          ls -l dist

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  docker:
    name: push pre-release image
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: ver
        run: |
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cloud-sync
          file: cloud-sync/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}-${{ steps.ver.outputs.stamp }}
          build-args: |
            VERSION=${{ steps.ver.outputs.tag }}
            COMMIT=${{ steps.ver.outputs.commit }}
            BUILD_TIME=${{ steps.ver.outputs.iso }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
