# Development builds.
#
# Runs on every push to the `dev` branch: format/vet/test (shared go-check
# action), build a static linux/amd64 binary, and publish container images
# tagged with a "-dev" suffix. No GitHub Release is created. Release candidates
# and releases are cut from `main` only (see release.yml).
#
# Image tags:
#   ghcr.io/devinaille/cloud-sync:dev
#   ghcr.io/devinaille/cloud-sync:dev-<stamp>
#   ghcr.io/devinaille/cloud-sync:sha-<short>-dev
# The embedded version (shown in the Web UI) is "dev-<stamp>", matching the
# pullable :dev-<stamp> tag.

name: Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/devinaille/cloud-sync

jobs:
  dev:
    name: test / build / push dev image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build metadata
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/go-check

      - uses: ./.github/actions/build-binary
        with:
          version: dev-${{ steps.sha.outputs.stamp }}
          commit: ${{ github.sha }}
          build-time: ${{ steps.sha.outputs.iso }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sync-dev-linux-amd64
          path: cloud-sync/cloud-sync
          if-no-files-found: error

      - name: Compute image tags
        id: tags
        run: |
          {
            echo "${{ env.IMAGE }}:dev"
            echo "${{ env.IMAGE }}:dev-${{ steps.sha.outputs.stamp }}"
            echo "${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}-dev"
          } > "$RUNNER_TEMP/tags.txt"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/tags.txt" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/push-image
        with:
          tags: ${{ steps.tags.outputs.tags }}
          version: dev-${{ steps.sha.outputs.stamp }}
          commit: ${{ github.sha }}
          build-time: ${{ steps.sha.outputs.iso }}
          token: ${{ secrets.GITHUB_TOKEN }}
