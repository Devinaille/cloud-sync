# Release packaging (release candidates and full releases).
#
# Triggers on any v* tag, or manual dispatch with an explicit tag. A tag whose
# name contains "-rc" (e.g. v1.0.0-rc1) is published as a GitHub pre-release and
# does NOT move :latest; any other tag (e.g. v1.0.0) is a full release and also
# updates :latest.
#
# Produces:
#   - a GitHub release with cloud-sync_<tag>_linux_amd64.tar.gz + SHA256SUMS
#   - ghcr.io/devinaille/cloud-sync:<tag>, :<tag>-<stamp> (+ :latest for full)
#
# The tag commit must be an ancestor of main (cut from main after merging dev).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build (e.g. v1.0.0-rc1 or v1.0.0)'
        required: true
      prerelease:
        description: 'Publish as a pre-release (no :latest)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/devinaille/cloud-sync

jobs:
  package:
    name: build + release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      commit: ${{ steps.ver.outputs.commit }}
      stamp: ${{ steps.ver.outputs.stamp }}
      iso: ${{ steps.ver.outputs.iso }}
      isrc: ${{ steps.ver.outputs.isrc }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve build metadata
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$tag" in *-rc*) isrc=true;; *) isrc="${{ inputs.prerelease }}";; esac
          else
            case "$tag" in *-rc*) isrc=true;; *) isrc=false;; esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "isrc=$isrc" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${{ steps.ver.outputs.tag }} is not on main; cut rc/release from main after merging dev"
            exit 1
          fi

      - uses: ./.github/actions/go-check

      - uses: ./.github/actions/build-binary
        with:
          version: ${{ steps.ver.outputs.tag }}
          commit: ${{ steps.ver.outputs.commit }}
          build-time: ${{ steps.ver.outputs.iso }}

      - name: Package tarball + checksums
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          STAGE="cloud-sync_${TAG}_linux_amd64"
          mkdir -p "dist/$STAGE"
          cp cloud-sync/cloud-sync "dist/$STAGE/cloud-sync"
          cp cloud-sync/README.md "dist/$STAGE/README.md"
          cp LICENSE "dist/$STAGE/LICENSE"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"
          ( cd dist && sha256sum -- *.tar.gz > SHA256SUMS )
          ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.isrc == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  docker:
    name: push image
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Compute image tags
        id: tags
        run: |
          {
            echo "${{ env.IMAGE }}:${{ needs.package.outputs.tag }}"
            echo "${{ env.IMAGE }}:${{ needs.package.outputs.tag }}-${{ needs.package.outputs.stamp }}"
            if [ "${{ needs.package.outputs.isrc }}" != "true" ]; then
              echo "${{ env.IMAGE }}:latest"
            fi
          } > "$RUNNER_TEMP/tags.txt"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/tags.txt" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/push-image
        with:
          tags: ${{ steps.tags.outputs.tags }}
          version: ${{ needs.package.outputs.tag }}
          commit: ${{ needs.package.outputs.commit }}
          build-time: ${{ needs.package.outputs.iso }}
          token: ${{ secrets.GITHUB_TOKEN }}
