# Run the published cloud-sync image (rc or release) instead of building locally.
#
# Usage (from the repo root):
#   CLOUD_SYNC_TAG=v0.1.0-rc1 \
#     docker compose -f docker-compose.yml -f docker-compose.rc.yml up -d --no-build
#
# This overrides only the image/pull policy; ports, volumes, environment and
# network are inherited from docker-compose.yml. `--no-build` skips the local
# Dockerfile build so the pulled image is used.
#
# Prerequisites (same as a normal deploy):
#   - a real, writable ./config.yaml (cp config.example.yaml config.yaml, then edit)
#   - the host media directories referenced by the config exist
# See README.md → 部署.

services:
  cloud-sync:
    image: ghcr.io/devinaille/cloud-sync:${CLOUD_SYNC_TAG:-latest}
    pull_policy: always
