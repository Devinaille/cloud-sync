# cloud-sync · Docker Compose
#
# Single service: cloud-sync. Sibling services (OpenList, qBittorrent,
# Emby, MoviePilot, etc.) are managed in their own compose files —
# cloud-sync only needs them on the same Docker network (`media`) so it can
# resolve OpenList's HTTP endpoint via `http://openlist:5244`.

services:
  cloud-sync:
    build:
      context: ./cloud-sync
      dockerfile: Dockerfile
    image: cloud-sync:1.0.0
    container_name: cloud-sync
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai

      # OpenList connection (resolved on the `media` Docker network)
      - OPENLIST_URL=http://openlist:5244
      - OPENLIST_TOKEN=replace-with-openlist-admin-token
      - OPENLIST_SRC_STORAGE=/local_media       # mount path of OpenList's local storage
      - OPENLIST_DST_STORAGE=/139yun_media      # mount path of OpenList's 139yun storage

      # Watched local directories (comma-separated absolute paths; must exist)
      - WATCH_DIRS=/mnt/basic/media/media,/mnt/basic/media/ani-rss

      # Sync state directory (must exist on host)
      - SYNC_STATUS_DIR=/mnt/basic/media/.sync_status

      # Cleanup whitelist (must include every WATCH_DIRS entry)
      - ALLOWED_SOURCE_PREFIXES=/mnt/basic/media/media,/mnt/basic/media/ani-rss

      # Cleanup policy
      - CLEANUP_AFTER_HOURS=72
      - CLEANUP_DRY_RUN=false                   # first deploy: leave true for 24h, then flip

      # Upload pipeline
      - UPLOAD_CONCURRENCY=2
      - STABILIZE_WAIT_SECONDS=30
      - POLL_INTERVAL_SECONDS=3
      - TASK_TIMEOUT_SECONDS=1800

      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=                                # empty = stdout, captured by `docker compose logs`
    volumes:
      # ZFS dataset: cloud-sync writes .sync_status here and removes videos after
      # 72h. The app-level ALLOWED_SOURCE_PREFIXES whitelist is the actual safety
      # boundary for the cleanup pass.
      - /mnt/basic/media:/mnt/basic/media:rw
      # Config file (recommended path; copy config.example.yaml to a working
      # file and edit, then update the source path on the left).
      - ./config.example.yaml:/config/cloud-sync.yaml:ro
    networks:
      - media

networks:
  media:
    driver: bridge
    name: media
