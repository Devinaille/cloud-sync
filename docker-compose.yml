# cloud-sync · Docker Compose — config-file mode (default / recommended)
#
# All settings live in ./config/cloud-sync.yaml; the environment here is minimal.
#
#   mkdir -p config && cp config.example.yaml config/cloud-sync.yaml
#   CLOUD_SYNC_TAG=v0.1.0-rc2 docker compose up -d
#
# Run user: set PUID/PGID (e.g. in a .env file or the shell) to the host user
# that owns the media dirs; defaults to 1000:1000. The user
# must be able to write the mounted media/config directories.
#
# Build from source instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Other config sources: docker-compose.env.yml (.env), docker-compose.inline.yml
# (environment written inline). Sibling services (OpenList, Emby, ...) live in
# their own compose files and only need to share the `media` network.

services:
  cloud-sync:
    image: ghcr.io/devinaille/cloud-sync:${CLOUD_SYNC_TAG:-latest}
    pull_policy: missing
    container_name: cloud-sync
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "8099:8099"     # Web UI + JSON API (no auth; LAN only)
    volumes:
      # Media dataset: cloud-sync watches it, writes .sync_status, removes
      # videos after 72h. ALLOWED_SOURCE_PREFIXES (in the config) is the safety
      # boundary for cleanup.
      - /mnt/basic/media:/mnt/basic/media:rw
      # Working config directory; holds cloud-sync.yaml (editable via the UI).
      - ./config:/config:rw
    networks:
      - media

networks:
  media:
    driver: bridge
    name: media
