# cloud-sync configuration example.
#
# Copy to /config/cloud-sync.yaml in the container, edit, and restart.
# Anything you set here overrides the corresponding environment variable; keys
# you omit here fall back to the env. If this file is absent, only the
# environment is used (legacy deploys keep working).
#
# Field names map 1:1 to the env-var names documented in cloud-sync/README.md —
# just lowercased. The startup loader is strict: typos in field names produce
# an error so you don't silently inherit defaults.

# OpenList HTTP endpoint and admin token.
openlist_url:         http://openlist:5244
openlist_token:       replace-with-openlist-admin-token
# OpenList storage mount paths (configured inside OpenList itself).
# These are the STORAGE ROOTS; cloud-sync appends a "media" subdir when it
# uploads, so files land at <storage_root>/media/<relative path>.
openlist_src_storage: /local_media
openlist_dst_storage: /139yun_media
# How to handle a file that already exists at the destination:
#   false (default) → send skip_existing=true; OpenList silently keeps the
#                     existing cloud file (no re-upload, saves bandwidth).
#   true            → send overwrite=true; OpenList replaces the cloud file.
openlist_overwrite: false

# Web UI + JSON API listen address. Default ":8099".
# Set to "" (empty) or "-" to disable the UI entirely.
ui_listen: ":8099"

# Task switch. Default false: on startup cloud-sync does NOT watch/upload or
# clean up until you enable it (Web UI → Dashboard → Start tasks, or set this
# to true). While paused you can still browse files, run the upload pre-check,
# and trigger a single-file retry or an on-demand cleanup (they run one-off,
# without starting the watcher). Enabling runs a startup scan and one cleanup
# pass immediately.
tasks_enabled: false

# Watched local directories. All paths must exist. fsnotify recurses into
# each one; uploads from any of them share the same cloud-side layout
# (under /139yun_media/media/<rel>). Add or remove entries freely.
watch_dirs:
  - /mnt/basic/media/media
  - /mnt/basic/media/ani-rss

# Where cloud-sync writes its .sync_status/<date>/... state. Defaults to
# /config/.sync_status (the mounted config dir) when unset; created on demand.
sync_status_dir:      /config/.sync_status

# Absolute path prefixes cleanup will accept deletions under. Every entry
# in watch_dirs above must be listed here, but the list may be broader
# (e.g. to let cleanup also touch strm_media/ if you point watch_dirs at it).
allowed_source_prefixes:
  - /mnt/basic/media/media
  - /mnt/basic/media/ani-rss

# Cleanup policy. after_hours counts from a successful upload; the local
# video is removed N hours later. NFO / poster / subtitle sidecars (if any)
# are not touched. First deploy: keep dry_run=true and tail the log for
# "[DRY-RUN] would delete" entries to confirm the paths before flipping.
cleanup_after_hours: 72
cleanup_dry_run:     true

# Upload pipeline.
upload_concurrency:        2
# Stabilize window (seconds) — wait until size+mtime unchanged this long.
stabilize_wait_seconds:    30
# OpenList task poll interval (seconds).
poll_interval_seconds:     3
# Per-request timeout (seconds) for OpenList calls: the initial copy and each
# task poll. It does NOT bound the whole upload - polling continues the same
# task until it finishes, reporting progress while it runs.
task_timeout_seconds:      1800

# Logging.
log_level: info            # debug | info | warn | error
log_file:  ""              # empty = stdout; otherwise absolute path; parent dir auto-created
