# cloud-sync · Docker Compose — .env mode
#
# Settings come from a .env file in this directory (see .env.example). Do NOT
# also create config/cloud-sync.yaml — the config file takes precedence over
# env, so a leftover file would silently win.
#
#   cp .env.example .env && $EDITOR .env
#   CLOUD_SYNC_TAG=v0.1.0-rc2 docker compose -f docker-compose.env.yml up -d
#
# PUID/PGID select the runtime user (defaults to 1000:1000).
# ./config is still mounted so the Web UI can save a config file, which then
# takes over from .env on the next reload/restart.
#
# Build from source: add docker-compose.build.yml
#   docker compose -f docker-compose.env.yml -f docker-compose.build.yml up -d --build

services:
  cloud-sync:
    image: ghcr.io/devinaille/cloud-sync:${CLOUD_SYNC_TAG:-latest}
    # Always re-check the registry so a moving tag (dev / latest) actually
    # updates on `up -d`. `missing` would silently keep the locally cached image.
    pull_policy: always
    container_name: cloud-sync
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "8099:8099"
    volumes:
      - /mnt/basic/media:/mnt/basic/media:rw
      - ./config:/config:rw
    networks:
      - media

networks:
  media:
    driver: bridge
    name: media
